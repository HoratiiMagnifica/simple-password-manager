<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер паролей - Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .totp-section {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .totp-section.active {
            display: block;
        }

        .info {
            background: #f0f8ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }

        .loading {
            text-align: center;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Менеджер паролей</h1>
        
        <div class="info">
            Войдите в систему, используя ваш мастер-пароль
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="totp-section" id="totpSection">
                <div class="form-group">
                    <label for="totp">Код двухфакторной аутентификации</label>
                    <input type="text" id="totp" placeholder="000000" maxlength="6">
                </div>
            </div>
            
            <button type="submit" id="submitBtn">Войти</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="text-align: center;">Вход в систему...</p>
        </div>
        
        <div class="error" id="error"></div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const totpInput = document.getElementById('totp');
        const totpSection = document.getElementById('totpSection');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        
        let requiresTOTP = false;
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            
            if (!requiresTOTP) {
                loadingDiv.classList.add('active');
            }
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value,
                        totp_code: totpInput.value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.requires_totp) {
                        requiresTOTP = true;
                        totpSection.classList.add('active');
                        totpInput.required = true;
                        submitBtn.disabled = false;
                        loadingDiv.classList.remove('active');
                    } else {
                        window.location.href = '/manager';
                    }
                } else {
                    showError(data.error || 'Ошибка входа');
                    resetForm();
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
                resetForm();
            }
        });
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            loadingDiv.classList.remove('active');
            submitBtn.disabled = false;
        }
        
        function resetForm() {
            requiresTOTP = false;
            totpSection.classList.remove('active');
            totpInput.required = false;
            loadingDiv.classList.remove('active');
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
